{% extends "base.html" %}
{% block title %}Verify Email | moealturej{% endblock %}
{% block extra_head %}
<style>
  .code-dots{display:flex;gap:8px;margin:8px 0 14px}.code-dots span{width:10px;height:10px;border-radius:999px;background:#d59cff;box-shadow:0 0 18px rgba(169,53,255,.7);animation:pulseDot 1.1s ease-in-out infinite}.code-dots span:nth-child(2){animation-delay:.15s}.code-dots span:nth-child(3){animation-delay:.3s}@keyframes pulseDot{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
</style>
{% endblock %}
{% block content %}
<section class="page-section auth-page"><div class="container auth-wrap">
  <form method="post" class="auth-card" data-loading-form="true" data-loading-title="Verifying code" data-loading-text="Checking the 6-digit security code and opening your account.">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="eyebrow">email security</div>
    <h1>Enter your code</h1>
    <div class="code-dots"><span></span><span></span><span></span></div>
    <p>We sent a 6-digit code to <strong>{{ email }}</strong>. It expires in 10 minutes.</p>
    <label>Security code<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="123456"></label>
    <button class="primary-cta auth-submit" type="submit" data-loading-text="Verifying..."><span class="btn-spinner"></span><i class="fas fa-shield-halved"></i><span class="btn-label">Verify code</span></button>
    <a class="auth-link" href="/{{ 'login' if flow == 'login' else 'signup' }}">Start over</a>
  </form>
</div></section>
{% endblock %}
