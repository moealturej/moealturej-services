{% extends "base.html" %}
{% block title %}Reset Password | moealturej Services{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/reset_password-1.css', v='20260827-full1') }}">
{% endblock %}

{% block content %}
<section class="page-section auth-page">
  <div class="container auth-wrap">
    <form method="post" class="auth-card" data-loading-form="true" data-loading-title="Updating password" data-loading-text="Saving your new password.">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="auth-icon">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="moealturej">
      </div>

      <div class="auth-kicker">moealturej Services</div>

      <h1>New password.</h1>

      <p class="auth-subtitle">
        Set a new password for your account.
      </p>

      <label>
        New password
        <input name="password" type="password" minlength="8" required placeholder="8+ characters" autocomplete="new-password">
      </label>

      <label>
        Confirm password
        <input name="confirm" type="password" minlength="8" required placeholder="Repeat password" autocomplete="new-password">
      </label>

      <button class="auth-submit" type="submit" data-loading-text="Saving...">
        <span class="btn-spinner"></span>
        <i class="fas fa-check"></i>
        <span class="btn-label">Update password</span>
      </button>
    </form>
  </div>
</section>
{% endblock %}
