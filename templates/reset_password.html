{% extends "base.html" %}
{% block title %}Reset Password | moealturej{% endblock %}
{% block content %}
<section class="page-section auth-page clean-auth-page">
  <div class="container auth-wrap">
    <form method="post" class="auth-card clean-auth-card" data-loading-form="true" data-loading-title="Updating password" data-loading-text="Saving your new password securely.">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-icon"><i class="fas fa-shield-halved"></i></div>
      <div class="eyebrow">Secure reset</div>
      <h1>New password</h1>
      <p class="auth-subtitle">Choose a strong password with at least 8 characters.</p>
      <label>New password<input name="password" type="password" minlength="8" required placeholder="8+ characters" autocomplete="new-password"></label>
      <label>Confirm password<input name="confirm" type="password" minlength="8" required placeholder="Repeat password" autocomplete="new-password"></label>
      <button class="primary-cta auth-submit" type="submit" data-loading-text="Saving..."><span class="btn-spinner"></span><i class="fas fa-check"></i><span class="btn-label">Update password</span></button>
    </form>
  </div>
</section>
{% endblock %}
