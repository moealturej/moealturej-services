{% extends "base.html" %}
{% block title %}404 | Page not found{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/404-1.css', v='20260827-full1') }}">
{% endblock %}
{% block content %}
<section class="page-section error-page">
  <div class="container">
    <div class="hero-shell error-shell">
      <div class="error-code">404</div>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist, may have moved, or the link may be incorrect.</p>
      <div class="btn-row" style="justify-content:center;">
        <a href="/" class="primary-cta">Go Home</a>
        <a href="/products" class="secondary-cta">Browse Store</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
