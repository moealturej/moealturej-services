{% extends "base.html" %}
{% block title %}Forgot Password | moealturej Services{% endblock %}

{% block extra_head %}
<style>
  .auth-page {
    min-height: calc(100vh - 120px);
    padding: 46px 18px 76px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .auth-wrap {
    display: flex;
    justify-content: center;
  }

  .auth-card {
    width: min(430px, 100%);
    position: relative;
    overflow: hidden;
    border-radius: 28px;
    padding: 28px;
    border: 1px solid rgba(168, 85, 247, .18);
    background:
      radial-gradient(circle at top left, rgba(168, 85, 247, .18), transparent 34%),
      radial-gradient(circle at bottom right, rgba(88, 101, 242, .13), transparent 40%),
      rgba(12, 9, 22, .78);
    box-shadow: 0 24px 80px rgba(0,0,0,.36);
    backdrop-filter: blur(18px);
  }

  .auth-card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.09), transparent 30%);
  }

  .auth-card > * {
    position: relative;
    z-index: 2;
  }

  .auth-icon {
    width: 62px;
    height: 62px;
    border-radius: 20px;
    display: grid;
    place-items: center;
    margin-bottom: 17px;
    padding: 10px;
    background:
      linear-gradient(135deg, rgba(147, 51, 234, .28), rgba(88, 101, 242, .14)),
      rgba(255,255,255,.045);
    border: 1px solid rgba(216, 180, 254, .20);
    box-shadow:
      0 16px 34px rgba(147, 51, 234, .18),
      inset 0 1px 0 rgba(255,255,255,.10);
    overflow: hidden;
  }

  .auth-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    border: 0;
    outline: 0;
    filter: drop-shadow(0 8px 18px rgba(168, 85, 247, .22));
  }

  .auth-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 13px;
    padding: 7px 11px;
    border-radius: 999px;
    background: rgba(168, 85, 247, .10);
    border: 1px solid rgba(168, 85, 247, .18);
    color: #d8b4fe;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .auth-kicker::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #a855f7;
    box-shadow: 0 0 14px rgba(168, 85, 247, .8);
  }

  .auth-card h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1;
    letter-spacing: -1.3px;
    font-weight: 950;
  }

  .auth-subtitle {
    margin: 12px 0 21px;
    color: rgba(255,255,255,.58);
    font-size: 13.5px;
    line-height: 1.55;
  }

  .auth-subtitle strong {
    color: #fff;
  }

  .auth-card label {
    display: grid;
    gap: 8px;
    margin-bottom: 13px;
    color: rgba(255,255,255,.72);
    font-size: 12px;
    font-weight: 900;
  }

  .auth-card input {
    width: 100%;
    min-height: 47px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.045);
    color: #fff;
    padding: 0 14px;
    outline: none;
    font-size: 13px;
    transition: border-color .18s ease, background .18s ease;
  }

  .auth-card input:focus {
    border-color: rgba(168, 85, 247, .42);
    background: rgba(255,255,255,.065);
  }

  .code-input {
    min-height: 50px !important;
    font-size: 18px !important;
    font-weight: 900;
    letter-spacing: .18em;
    text-align: center;
  }

  .auth-row-links {
    display: flex;
    justify-content: flex-end;
    margin: -2px 0 16px;
  }

  .auth-row-links a,
  .auth-link {
    color: #d8b4fe;
    text-decoration: none;
    font-size: 12px;
    font-weight: 850;
  }

  .auth-submit {
    width: 100%;
    min-height: 48px;
    border: 0;
    border-radius: 17px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #fff;
    font-size: 13.5px;
    font-weight: 950;
    cursor: pointer;
    background: linear-gradient(135deg, #9333ea, #5865f2);
    box-shadow: 0 16px 34px rgba(147, 51, 234, .24);
    transition: transform .18s ease, filter .18s ease;
  }

  .auth-submit:hover {
    transform: translateY(-2px);
    filter: brightness(1.06);
  }

  .auth-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0 13px;
    color: rgba(255,255,255,.38);
    font-size: 11px;
    font-weight: 850;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .auth-divider::before,
  .auth-divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: rgba(255,255,255,.08);
  }

  .oauth-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
  }

  .oauth-btn {
    min-height: 45px;
    border-radius: 15px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.045);
    color: #fff;
    font-size: 12.5px;
    font-weight: 900;
  }

  .oauth-btn.disabled {
    opacity: .45;
  }

  .discord-login-btn {
    background: linear-gradient(135deg, rgba(88,101,242,.50), rgba(88,101,242,.18));
    border-color: rgba(88,101,242,.28);
  }

  .google-login-btn {
    background: rgba(255,255,255,.07);
  }

  .auth-link {
    display: block;
    margin-top: 17px;
    text-align: center;
  }

  .centered-hint {
    margin: 12px 0 0;
    color: rgba(255,255,255,.45);
    font-size: 11.5px;
    line-height: 1.45;
    text-align: center;
  }

  .code-dots {
    display: flex;
    gap: 8px;
    margin: 17px 0 0;
  }

  .code-dots span {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: #a855f7;
    box-shadow: 0 0 18px rgba(168, 85, 247, .7);
    animation: pulseDot 1.1s ease-in-out infinite;
  }

  .code-dots span:nth-child(2) { animation-delay: .15s; }
  .code-dots span:nth-child(3) { animation-delay: .3s; }

  @keyframes pulseDot {
    0%, 100% { opacity: .35; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }

  @media (max-width: 520px) {
    .auth-page {
      padding: 34px 14px 66px;
      align-items: flex-start;
    }

    .auth-card {
      padding: 23px;
      border-radius: 25px;
    }

    .auth-card h1 {
      font-size: 34px;
      letter-spacing: -1px;
    }

    .oauth-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
{% endblock %}

{% block content %}
<section class="page-section auth-page">
  <div class="container auth-wrap">
    <form method="post" class="auth-card" data-loading-form="true" data-loading-title="Sending reset link" data-loading-text="Creating a secure reset link.">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="auth-icon">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="moealturej">
      </div>

      <div class="auth-kicker">moealturej Services</div>

      <h1>Forgot password?</h1>

      <p class="auth-subtitle">
        Enter your email and we’ll send a reset link.
      </p>

      <label>
        Email
        <input name="email" type="email" required placeholder="you@example.com" autocomplete="email">
      </label>

      <button class="auth-submit" type="submit" data-loading-text="Sending...">
        <span class="btn-spinner"></span>
        <i class="fas fa-envelope"></i>
        <span class="btn-label">Send reset link</span>
      </button>

      <a class="auth-link" href="/login">Back to login</a>
    </form>
  </div>
</section>
{% endblock %}
