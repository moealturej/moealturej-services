{% extends "base.html" %}
{% block title %}Forgot Password | moealturej{% endblock %}
{% block content %}
<section class="page-section auth-page clean-auth-page">
  <div class="container auth-wrap">
    <form method="post" class="auth-card clean-auth-card" data-loading-form="true" data-loading-title="Sending reset link" data-loading-text="Creating a secure password reset link and emailing it to you.">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="auth-icon"><i class="fas fa-key"></i></div>
      <div class="eyebrow">Account recovery</div>
      <h1>Forgot password?</h1>
      <p class="auth-subtitle">Enter your account email and we’ll send a secure reset link that expires in 20 minutes.</p>
      <label>Email<input name="email" type="email" required placeholder="you@example.com" autocomplete="email"></label>
      <button class="primary-cta auth-submit" type="submit" data-loading-text="Sending..."><span class="btn-spinner"></span><i class="fas fa-envelope"></i><span class="btn-label">Send reset link</span></button>
      <a class="auth-link" href="/login">Back to login</a>
    </form>
  </div>
</section>
{% endblock %}
